<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a5a44">
<link rel="manifest" href="/assets/manifest.webmanifest">
<link rel="icon" href="/assets/brand/favicon.png">
<title>Spends</title>
<script>(function(){var d=document.documentElement;d.dataset.palette='{{look}}';d.dataset.theme='{{theme}}';try{var l=localStorage.getItem('look');if(l)d.dataset.palette=l;var t=localStorage.getItem('theme');if(t)d.dataset.theme=t}catch(e){}})()</script>
<link rel="stylesheet" href="/assets/fonts.css?v={{v}}">
<link rel="stylesheet" href="/assets/common.css?v={{v}}">
<style>
 body{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
 .embed .bar{display:none}
 main{max-width:980px;margin:0 auto;padding:14px 12px}
 .grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
 @media(max-width:820px){.grid2{grid-template-columns:1fr}}
 h2{margin:0 0 10px;font-family:var(--font-display);font-size:24px;font-weight:var(--display-weight)}
 h3{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:600}
 .lbl{display:block;font-size:14px;color:var(--muted);margin:12px 0 5px}
 .opts{display:flex;flex-wrap:wrap;gap:6px}
 .opt{min-height:42px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer}
 .opt.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
 .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .r3{display:grid;grid-template-columns:1fr 1.1fr 1.3fr;gap:8px}
 .amt{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
 .quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
 .quick::-webkit-scrollbar{display:none}
 .quick .opt{flex:none;min-height:38px;font-size:14px}
 .sum{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
 .sum .big{font-family:var(--font-display);font-size:38px;font-variant-numeric:tabular-nums;line-height:1.1}
 .src{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);margin-bottom:8px}
 .src b{color:var(--ink);font-variant-numeric:tabular-nums}
 .grp{margin-top:14px}
 .grp .gh{display:flex;justify-content:space-between;font-weight:600;border-bottom:1.5px solid var(--line);padding-bottom:4px}
 .ex{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-soft)}
 .ex .t{flex:1;min-width:0}
 .ex .t b{display:block;overflow-wrap:anywhere}
 .ex .t span{font-size:13px;color:var(--muted)}
 .ex .a{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
 .ex button{min-height:38px;min-width:38px;padding:4px 8px}
 .datebar{display:flex;gap:6px;margin-bottom:12px}
 .datebar input{flex:1;min-width:0}
 .datebar button{min-width:46px}
 .empty{padding:22px 4px;color:var(--muted)}
 .editing{border-color:var(--brass)!important;background:var(--brass-soft)}
 .err{color:var(--crimson);font-size:14px;min-height:1.3em;margin-top:6px}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="/spends"><img src="/assets/brand/mark-cream.png" alt="" width="38" height="38"><span>Spends</span></a>
  <div class="tools">
    <a class="nav-out" href="/counter">Counter</a>
    <a class="nav-out hidden" id="ownerLink" href="/owner">Dashboard</a>
  </div>
  <div class="icons">
    <button class="iconbtn" data-look-btn aria-label="Change look"></button>
    <button class="iconbtn" data-theme-btn aria-label="Switch theme"></button>
    <button class="iconbtn" id="logoutBtn" aria-label="Log out"></button>
  </div>
</header>
<main>
  <div class="grid2">
    <section class="card" id="formCard">
      <h2 id="formTitle">Add a spend</h2>
      <h3 id="quickH" class="hidden">Regular buys</h3>
      <div class="quick" id="quick"></div>

      <span class="lbl">Category</span>
      <div class="opts" id="cats"></div>

      <label class="lbl" for="item">What was bought</label>
      <input id="item" list="itemlist" placeholder="Tomatoes" autocomplete="off" maxlength="80">
      <datalist id="itemlist"></datalist>

      <div class="r3">
        <div><label class="lbl" for="qty">Quantity</label><input id="qty" type="number" inputmode="decimal" min="0" step="any" placeholder="5"></div>
        <div><label class="lbl" for="unit">Unit</label>
          <select id="unit"><option>kg</option><option>g</option><option>L</option><option>ml</option><option>pcs</option><option>dozen</option><option>packet</option><option>bag</option><option>cyl</option><option>tray</option></select></div>
        <div><label class="lbl" for="amount">Amount paid (₹)</label><input id="amount" class="amt" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
      </div>

      <span class="lbl">Paid from</span>
      <div class="opts" id="src">
        <button type="button" class="opt on" data-s="cash">Cash from counter</button>
        <button type="button" class="opt" data-s="upi">UPI</button>
        <button type="button" class="opt" data-s="bank">Bank (HDFC)</button>
        <button type="button" class="opt" data-s="partner">Partner's own pocket</button>
      </div>
      <div id="partnerRow" class="hidden"><label class="lbl" for="paidby">Which partner paid</label><input id="paidby" list="partnerlist" placeholder="Name" maxlength="40"><datalist id="partnerlist"></datalist></div>

      <div class="r2">
        <div><label class="lbl" for="supplier">Shop or supplier (optional)</label><input id="supplier" list="supplierlist" placeholder="Sabzi mandi" maxlength="60"><datalist id="supplierlist"></datalist></div>
        <div><label class="lbl" for="note">Note (optional)</label><input id="note" placeholder="Bill number or reason" maxlength="200"></div>
      </div>
      <div id="whenRow" class="hidden"><label class="lbl" for="spent_on">Date</label><input id="spent_on" type="date"></div>

      <div class="err" id="err" role="alert"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="primary" id="save" style="flex:1;min-height:52px;font-size:18px">Add spend</button>
        <button id="cancel" class="hidden">Cancel</button>
      </div>
    </section>

    <section>
      <div class="datebar">
        <button id="prev" aria-label="Previous day">‹</button><input type="date" id="date" aria-label="Day"><button id="next" aria-label="Next day">›</button><button id="today">Today</button>
      </div>
      <div class="card">
        <div class="sum"><h2 style="margin:0" id="dayName">Today</h2><span class="big" id="total">₹0</span></div>
        <div class="src" id="bysrc"></div>
        <div id="list"></div>
      </div>
    </section>
  </div>
</main>
<div id="toast"></div>
<script src="/assets/common.js?v={{v}}"></script>
<script>
const $ = s => document.querySelector(s);
const SRC = { cash: 'Cash from counter', upi: 'UPI', bank: 'Bank', partner: 'Partner paid' };
let ME, CATS = [], cat = 'Vegetables', src = 'cash', date = todayIST(), editing = null, DATA = null, RECENT = null;
const num = v => Number(v).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const rs = n => '₹' + num(n);
const dayName = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });

function drawCats() {
  $('#cats').innerHTML = CATS.map(c => `<button type="button" class="opt ${c === cat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
}
function drawSrc() {
  document.querySelectorAll('#src .opt').forEach(b => b.classList.toggle('on', b.dataset.s === src));
  $('#partnerRow').classList.toggle('hidden', src !== 'partner');
}
async function loadRecent() {
  RECENT = await api('/api/expenses/recent');
  $('#quickH').classList.toggle('hidden', !RECENT.items.length);
  $('#quick').innerHTML = RECENT.items.map((r, i) => `<button type="button" class="opt" data-q="${i}">${esc(r.item)}</button>`).join('');
  $('#itemlist').innerHTML = RECENT.items.map(r => `<option value="${esc(r.item)}">`).join('');
  $('#partnerlist').innerHTML = RECENT.partners.map(p => `<option value="${esc(p)}">`).join('');
  $('#supplierlist').innerHTML = RECENT.suppliers.map(p => `<option value="${esc(p)}">`).join('');
}
function clearForm(keep) {
  $('#item').value = ''; $('#qty').value = ''; $('#amount').value = ''; $('#note').value = '';
  if (!keep) { $('#supplier').value = ''; $('#paidby').value = ''; }
  $('#err').textContent = '';
}
function setEditing(e) {
  editing = e;
  $('#formCard').classList.toggle('editing', !!e);
  $('#formTitle').textContent = e ? 'Edit spend' : 'Add a spend';
  $('#save').textContent = e ? 'Save changes' : 'Add spend';
  $('#cancel').classList.toggle('hidden', !e);
  $('#whenRow').classList.toggle('hidden', !(e || ME.role === 'owner'));
  $('#spent_on').value = e ? e.spent_on : date;
  if (e) {
    cat = e.category; src = e.paid_from; drawCats(); drawSrc();
    $('#item').value = e.item; $('#qty').value = e.qty ?? ''; if (e.unit) $('#unit').value = e.unit;
    $('#amount').value = e.amount; $('#paidby').value = e.paid_by || ''; $('#supplier').value = e.supplier || ''; $('#note').value = e.note || '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else clearForm(true);
}
async function load() {
  DATA = await api('/api/expenses?date=' + date);
  CATS = DATA.categories; if (!CATS.includes(cat)) cat = CATS[0]; drawCats();
  $('#date').value = date; if (!editing) $('#spent_on').value = date; $('#dayName').textContent = date === todayIST() ? 'Today' : dayName(date);
  $('#total').textContent = rs(DATA.total);
  const bs = DATA.by_source;
  $('#bysrc').innerHTML = Object.keys(SRC).filter(k => bs[k]).map(k => `<span>${SRC[k]} <b>${rs(bs[k])}</b></span>`).join('') || '<span>No spends yet</span>';
  if (!DATA.items.length) { $('#list').innerHTML = '<div class="empty">Nothing entered for this day. Add the first spend on the left.</div>'; return; }
  $('#list').innerHTML = DATA.by_category.map(g => `<div class="grp"><div class="gh"><span>${esc(g.category)}</span><span>${rs(g.total)}</span></div>` +
    DATA.items.filter(r => r.category === g.category).map(r => `<div class="ex"><div class="t"><b>${esc(r.item)}${r.qty != null ? ' · ' + num(r.qty) + ' ' + esc(r.unit) : ''}</b>
      <span>${SRC[r.paid_from]}${r.paid_by ? ' (' + esc(r.paid_by) + ')' : ''}${r.supplier ? ' · ' + esc(r.supplier) : ''} · ${timeStr(r.created_at)}${r.edited_at ? ' · edited' : ''}${r.note ? '<br>' + esc(r.note) : ''}</span></div>
      <div class="a">${rs(r.amount)}</div>
      ${r.can_edit ? `<button class="ghost" data-edit="${r.id}" aria-label="Edit">Edit</button>` : ''}
      ${r.can_delete ? `<button class="ghost" data-del="${r.id}" aria-label="Remove ${esc(r.item)}">${ICON.trash}</button>` : ''}</div>`).join('') + '</div>').join('');
}
async function save() {
  const body = { category: cat, item: $('#item').value, qty: $('#qty').value, unit: $('#unit').value, amount: $('#amount').value,
    paid_from: src, paid_by: $('#paidby').value, supplier: $('#supplier').value, note: $('#note').value };
  if (editing || ME.role === 'owner') body.spent_on = $('#spent_on').value || date;
  else body.spent_on = date;
  $('#err').textContent = '';
  $('#save').disabled = true;
  try {
    if (editing) { await api('/api/expenses/' + editing.id, { method: 'PUT', body }); toast('Changes saved'); setEditing(null); }
    else { const r = await api('/api/expenses', { body }); toast('Added ' + rs(r.amount) + ' · ' + r.item); clearForm(true); $('#item').focus(); }
    if (body.spent_on !== date) { date = body.spent_on; }
    await Promise.all([load(), loadRecent()]);
  } catch (e) { if (e.message !== 'login') $('#err').textContent = e.message; }
  $('#save').disabled = false;
}
document.addEventListener('click', async e => {
  const c = e.target.closest('[data-c]'); if (c) { cat = c.dataset.c; drawCats(); return; }
  const s = e.target.closest('#src [data-s]'); if (s) { src = s.dataset.s; drawSrc(); if (src === 'partner') $('#paidby').focus(); return; }
  const q = e.target.closest('[data-q]');
  if (q) {
    const r = RECENT.items[+q.dataset.q];
    cat = r.category; $('#item').value = r.item; if (r.unit) $('#unit').value = r.unit; $('#supplier').value = r.supplier || '';
    $('#qty').value = r.qty ?? ''; $('#amount').value = ''; src = r.paid_from; if (r.paid_by) $('#paidby').value = r.paid_by;
    drawCats(); drawSrc(); $('#amount').focus(); return;
  }
  const ed = e.target.closest('[data-edit]'); if (ed) { setEditing(DATA.items.find(x => x.id === +ed.dataset.edit)); return; }
  const del = e.target.closest('[data-del]');
  if (del) {
    const r = DATA.items.find(x => x.id === +del.dataset.del);
    if (!confirm('Remove ' + r.item + ' (' + rs(r.amount) + ')?')) return;
    try { await api('/api/expenses/' + r.id, { method: 'DELETE' }); toast('Removed'); await Promise.all([load(), loadRecent()]); }
    catch (err) { if (err.message !== 'login') toast(err.message, true); }
  }
});
$('#save').onclick = save;
$('#cancel').onclick = () => setEditing(null);
$('#formCard').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); save(); } });
$('#date').onchange = () => { if ($('#date').value) { date = $('#date').value; load(); } };
const shift = n => { date = new Date(new Date(date + 'T00:00:00Z').getTime() + n * 86400000).toISOString().slice(0, 10); if (date > todayIST()) date = todayIST(); load(); };
$('#prev').onclick = () => shift(-1); $('#next').onclick = () => shift(1); $('#today').onclick = () => { date = todayIST(); load(); };
async function init() {
  $('#logoutBtn').innerHTML = ICON.out; $('#logoutBtn').onclick = logout; mountThemeButtons();
  ME = await api('/api/me');
  if (ME.role === 'owner') $('#ownerLink').classList.remove('hidden');
  $('#whenRow').classList.toggle('hidden', ME.role !== 'owner');
  drawSrc();
  await Promise.all([load(), loadRecent()]);
  $('#spent_on').value = date;
}
init().catch(e => { if (e.message !== 'login') $('#list').innerHTML = '<div class="empty">Could not load. Check the internet and refresh.</div>'; });
</script>
</body>
</html>
